---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rsync-seedbox

commonAnnotations:
  repo: https://github.com/charlesthomas/homelab-rsync-seedbox
labels:
- includeSelectors: true
  pairs:
    app: rsync-seedbox

resources:
- resources/configmaps.yaml
- resources/cronjobs.yaml
- resources/external-secrets.yaml
- resources/namespaces.yaml
configMapGenerator:
- name: grafana-dashboard-rsync-seedbox
  files:
  - grafana/rsync-seedbox.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
